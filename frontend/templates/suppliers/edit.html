{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="mb-8">
    <a href="{{ url_for('suppliers.suppliers') }}" class="inline-flex items-center text-cyan-600 hover:text-cyan-800 mb-4">
      <span class="material-symbols-outlined text-lg mr-1">arrow_back</span>
      {{ _('back_to_suppliers') }}
    </a>
    <h2 class="text-2xl font-bold text-gray-800">Edit Supplier</h2>
    <p class="text-gray-600">Modify supplier details and click Save.</p>
  </div>

  <div class="card p-6">
    <form action="{{ url_for('suppliers.edit_supplier_submit', doc_id=supplier.id) }}" method="POST" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Basic Information -->
        <div class="space-y-6">
          <h3 class="text-lg font-medium text-gray-900 border-b pb-2">{{ _('basic_information') }}</h3>
          
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ _('supplier_name') }} *</label>
            <input type="text" id="name" name="name" required value="{{ supplier.name or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>

          <div>
            <label for="contact_person" class="block text-sm font-medium text-gray-700">{{ _('contact_person') }}</label>
            <input type="text" id="contact_person" name="contact_person" value="{{ supplier.contact_person or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('email') }}</label>
            <input type="email" id="email" name="email" value="{{ supplier.email or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>

          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ _('phone_number') }}</label>
            <input type="tel" id="phone" name="phone" value="{{ supplier.phone or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>
        </div>

        <!-- Additional Information -->
        <div class="space-y-6">
          <h3 class="text-lg font-medium text-gray-900 border-b pb-2">{{ _('additional_information') }}</h3>
          
          <div>
            <label for="address" class="block text-sm font-medium text-gray-700">{{ _('address') }}</label>
            <textarea id="address" name="address" rows="3" dir="ltr"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500">{{ supplier.address or '' }}</textarea>
          </div>

          <div>
            <label for="tax_id" class="block text-sm font-medium text-gray-700">{{ _('tax_id') }}</label>
            <input type="text" id="tax_id" name="tax_id" value="{{ supplier.tax_id or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>

          <div>
            <label for="payment_terms" class="block text-sm font-medium text-gray-700">{{ _('payment_terms') }}</label>
            <input type="text" id="payment_terms" name="payment_terms" placeholder="{{ _('payment_terms_eg') }}" value="{{ supplier.payment_terms or '' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500"
                   dir="ltr">
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label for="notes" class="block text-sm font-medium text-gray-700">{{ _('notes') }}</label>
        <textarea id="notes" name="notes" rows="3" dir="ltr"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-cyan-500 focus:ring-cyan-500">{{ supplier.notes or '' }}</textarea>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <a href="{{ url_for('suppliers.suppliers') }}" class="btn-secondary">
          {{ _('cancel') }}
        </a>
        <button type="submit" class="btn-primary">
          <span class="material-symbols-outlined text-lg mr-1">save</span>
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
